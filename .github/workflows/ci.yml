name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: cd backend && pytest tests
      # Phase 5 gate: re-derives the accuracy numbers live on a fixed
      # seed and fails the build if any acceptance criterion regresses.
      - run: cd backend && python scripts/verify_accuracy_plan.py
      - run: cd backend && python -m compileall app

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd frontend && npm install
      - run: cd frontend && npm run build
