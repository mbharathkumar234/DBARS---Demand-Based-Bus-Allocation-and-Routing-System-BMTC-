[pytest]
testpaths = tests
addopts = --basetemp=.pytest_tmp
# `strict` mode: an async test must carry @pytest.mark.asyncio, and an unknown
# mark is an error rather than a warning. This is deliberate -- the previous
# setup skipped async tests and still reported the run green, so a regression
# test could sit inert indefinitely without anyone noticing.
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error::pytest.PytestUnhandledCoroutineWarning
markers =
    asyncio: run this coroutine test via pytest-asyncio
